<!doctype html>
<!--
  Writes the Real life suite's capture crops to disk so offline analysis can see
  exactly the pixels the recogniser saw. Same seeded card draw and same scene
  options as scripts/reallife_runner.html, and it uses the production crop
  geometry via cropScene — so a crop here is byte-identical to the one the
  pipeline was scored on, not a lookalike.

    PREVIEW_SAVE_DIR=/tmp/probe-crops python3 scripts/serve_preview.py 8777
    open /scripts/harvest_crops.html?scenes=20
-->
<meta charset="utf-8">
<title>harvest</title>
<style>body{margin:0;background:#101014;color:#dde;font:13px ui-monospace,monospace;padding:12px}</style>
<div id="log">…</div>

<script type="module">
import { buildScene, cropScene, perfectCrop, releaseScene } from "/src/snaptest/scene.js";

const q = new URLSearchParams(location.search);
const SCENES = +(q.get("scenes") ?? 20);
const PER_SCENE = 10, SEED = 20260803, TOP_N = 2000;
const CLICK_MIX = { tokens: 0.25, basics: 0.05 };
const REAL_MATS = ["magic-con-vegas","ff-cloud","commander-series-2","mythic-land-black",
  "mythic-land-other","ultra-pro-green","ultra-pro-blue","ultra-pro-red","ultra-pro-white",null];

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

const logEl = document.getElementById("log");
const say = (s) => { logEl.textContent = s; };

async function samplePopular(n) {
  const [names, tokens, rows] = await Promise.all([
    fetch("/carddata/popularity.json").then(r=>r.json()),
    fetch("/carddata/tokens.json").then(r=>r.json()),
    fetch("/carddata/cards.json").then(r=>r.json()),
  ]);
  const byName = new Map();
  for (const r of rows) {
    if (r[4] !== 0) continue;
    const l = byName.get(r[0]); if (l) l.push(r[3]); else byName.set(r[0], [r[3]]);
  }
  const build = (list, pool) => list.map(name => ({ name, ids: byName.get(name), pool })).filter(e=>e.ids);
  const basics = build(["Forest","Island","Swamp","Mountain","Plains","Wastes",
    "Snow-Covered Forest","Snow-Covered Island","Snow-Covered Swamp",
    "Snow-Covered Mountain","Snow-Covered Plains"], "basic");
  const cards = build(names,"card"), tks = build(tokens,"token");
  const ranked = cards.slice(0, TOP_N);
  const picked = [], seen = new Set(); const rand = mulberry32(SEED); let guard = 0;
  while (picked.length < n && guard++ < n*50) {
    const roll = rand();
    const pool = roll < CLICK_MIX.tokens ? tks
      : roll < CLICK_MIX.tokens + CLICK_MIX.basics ? basics : ranked;
    const j = (rand()*pool.length)|0; const e = pool[j]; if (!e) continue;
    const key = `${e.name}:${j}`; if (seen.has(key)) continue; seen.add(key);
    picked.push({ name: e.name, pool: e.pool, id: e.ids[(rand()*e.ids.length)|0] });
  }
  return picked;
}

const dataUrlToBlob = (u) => fetch(u).then(r => r.blob());
const save = (name, blob) =>
  fetch("/__save/" + name, { method: "POST", body: blob }).then(r => r.text());

(async () => {
  const set = await samplePopular(SCENES * PER_SCENE);
  const meta = [];
  let i = 0;
  for (let s = 0; s < SCENES; s++) {
    const group = set.slice(s*PER_SCENE, (s+1)*PER_SCENE);
    if (!group.length) break;
    const scene = await buildScene(group, s, 1920, 1080, {
      dice: true, perspective: true, playmat: REAL_MATS[s % REAL_MATS.length],
    });
    for (const p of scene.placed) {
      const tag = String(i).padStart(3, "0");
      // The capture crop: exactly what the pipeline was scored on.
      const crop = cropScene(scene.canvas, p.nx, p.ny);
      await save(`crop_${tag}.jpg`, await dataUrlToBlob(crop.url));
      // The perfect crop: the same degraded pixels, counter-rotated to exact
      // card bounds. Comparing descriptors on THIS isolates the descriptor from
      // localization — the pipeline's own perfect-crop control already showed
      // most misses are not recovered by correct framing, so this is the input
      // that asks whether the descriptor itself is the ceiling.
      await save(`perfect_${tag}.jpg`,
        await dataUrlToBlob(perfectCrop(scene.canvas, p, scene.cardW, scene.cardH)));
      meta.push({ i, file: `crop_${tag}.jpg`, perfect: `perfect_${tag}.jpg`,
        name: p.card.name, id: p.card.id, pool: p.card.pool,
        scene: s, rot: p.rotationClass, occ: p.occ, layout: p.layout,
        coverage: p.coverage, nx: +crop.px.toFixed(4), ny: +crop.py.toFixed(4) });
      i++;
      say(`saved ${i}/${SCENES*PER_SCENE}`);
    }
    releaseScene(scene.canvas);
  }
  await save("meta.json", new Blob([JSON.stringify(meta, null, 1)], { type: "application/json" }));
  say(`DONE — ${meta.length} crops + meta.json`);
  document.title = "finished";
})().catch(e => { say("FAILED: " + e); document.title = "failed"; });
</script>
