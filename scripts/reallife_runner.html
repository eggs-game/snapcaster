<!doctype html>
<!--
  Headless-ish Real life runner.

  SNAPTEST proper lives in SnapTest.jsx and needs a Vite build. matcher.js, the
  recognition worker and scene.js are all plain JS/ES modules, so the same
  pipeline can be driven without one. This mirrors the realLife mode's card
  draw, scene options and scoring exactly — it is a way to RUN the suite on a
  machine with no Node, not a second implementation of it. If the two ever
  disagree, SnapTest.jsx is authoritative.

    python3 scripts/serve_preview.py 8777
    open /scripts/reallife_runner.html?scenes=20

  Progress and the final summary are on window.__run.
-->
<meta charset="utf-8">
<title>real life runner</title>
<script type="importmap">
{ "imports": { "tesseract.js": "/node_modules/tesseract.js/dist/tesseract.esm.min.js" } }
</script>
<style>
  body { margin: 0; background: #0e0e11; color: #dde; font: 13px ui-monospace, monospace; padding: 12px; }
  #log { white-space: pre-wrap; line-height: 1.5; }
  .bad { color: #f88; } .good { color: #8f8; }
</style>
<div id="log">starting…</div>

<script type="module">
import { identify as identifyCard, preload, setIsolationCapScale, setArtScanScale, setOcrSkipDistance, setHalfRotations, setOrbShortlist, setEarlyOrbProbe, setEarlyOrbExit, setEarlyOrbAfterSeeds } from "/src/recognition/matcher.js";
import { buildScene, cropScene, perfectCrop, releaseScene } from "/src/snaptest/scene.js";
import { degrade, loadImage, scryfallImageUrl } from "/src/snaptest/degrade.js";

const q = new URLSearchParams(location.search);

// The release-gate suites from docs/testing.md, mirroring MODES in
// SnapTest.jsx. Real life alone does not clear a recognition release: crop,
// retrieval and OCR decision changes require the full plan, and the other
// suites stress things Real life does not — Vegas the decorative-contour
// competition, the single-card modes the top-edge clipped placements.
const MODES = {
  realLife:   { scenes: 20, perScene: 10, popular: 2000,  seed: 20260803, dice: true, perspective: true, rotateMats: true },
  tableauEdh: { scenes: 10, perScene: 10, popular: 15000 },
  vegas:      { scenes: 20, perScene: 10, popular: 15000, playmat: "magic-con-vegas" },
  dice:       { scenes: 10, perScene: 10, popular: 15000, dice: true },
  random200:  { single: true, size: 200, index: true },
  edh200:     { single: true, size: 200, popular: 15000 },
};
const MODE = q.get("mode") || "realLife";
const M = MODES[MODE] || MODES.realLife;
const SCENES = +(q.get("scenes") ?? (M.scenes || 20));
// Overrides scene.js's calibrated BLUR_SCALE, so the two arms of a blur A/B can
// run back to back in one session. Latency here is only ever comparable within
// a session: the host's own CPU load drifts, and a delta measured against a
// number from hours ago has been wrong before.
const BLUR = q.get("blur") !== null ? +q.get("blur") : undefined;
// Scales the isolation proposal cap. Preparing the ~145 surviving crops is
// ~82% of isolatePrep, so this is the arm that actually moves that stage.
const CAP = q.get("cap") !== null ? +q.get("cap") : undefined;
// Scales the global art-scan budget — art rescoring is the largest single
// cost in the pipeline at 960ms per scan.
const ART = q.get("art") !== null ? +q.get("art") : undefined;
// OCR skip distance. ~900ms/scan for a pathway that has never settled a scan
// on this suite; raising this skips it on more scans.
const OCR = q.get("ocr") !== null ? +q.get("ocr") : undefined;
// Half the rotation variants for crops already oriented by construction.
// queryVariants is 925ms/scan, the largest single cost in the pipeline.
const HALFROT = q.get("halfrot") !== null ? q.get("halfrot") === "1" : undefined;
// ORB verification shortlist size. Fetch (317ms) and match (299ms) both
// scale with it and together are ~76% of the orb stage.
const ORBN = q.get("orbn") !== null ? +q.get("orbn") : undefined;
// Probe: would ORB have settled the answer before isolation ran? Measures the
// ceiling of moving verification earlier, without changing any answer.
const EARLYORB = q.get("earlyorb") === "1";
// Act on the probe: a decisive pre-isolation match skips the sweep entirely.
const EARLYEXIT = q.get("earlyexit") === "1";
// Run the early check after seeds rather than after refinement, so a decisive
// match skips refinement (~710ms) as well as isolation (~1070ms).
const EARLYSEEDS = q.get("earlyseeds") === "1";
const PER_SCENE = M.perScene || 10;
const SEED = M.seed;            // only realLife fixes its draw
const TOP_N = M.popular || 15000;
const CLICK_MIX = { tokens: 0.25, basics: 0.05 };
const REAL_MATS = [
  "magic-con-vegas", "ff-cloud", "commander-series-2",
  "mythic-land-black", "mythic-land-other",
  "ultra-pro-green", "ultra-pro-blue", "ultra-pro-red", "ultra-pro-white",
  null,
];

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const logEl = document.getElementById("log");
const lines = [];
const say = (s) => { lines.push(s); logEl.textContent = lines.slice(-40).join("\n"); };

window.__run = { done: 0, correct: 0, total: SCENES * PER_SCENE, finished: false, recs: [] };

// ── card draw: identical to SnapTest.samplePopular with realLife's options ──
async function samplePopular(n) {
  const [names, tokens, rows] = await Promise.all([
    fetch("/carddata/popularity.json").then((r) => r.json()),
    fetch("/carddata/tokens.json").then((r) => r.json()),
    fetch("/carddata/cards.json").then((r) => r.json()),
  ]);
  const byName = new Map();
  for (const r of rows) {
    if (r[4] !== 0) continue;
    const list = byName.get(r[0]);
    if (list) list.push(r[3]); else byName.set(r[0], [r[3]]);
  }
  const build = (list, pool) => list
    .map((name) => ({ name, ids: byName.get(name), pool }))
    .filter((e) => e.ids);
  const basics = build([
    "Forest", "Island", "Swamp", "Mountain", "Plains", "Wastes",
    "Snow-Covered Forest", "Snow-Covered Island", "Snow-Covered Swamp",
    "Snow-Covered Mountain", "Snow-Covered Plains",
  ], "basic");
  const cards = build(names, "card"), tks = build(tokens, "token");
  const ranked = cards.slice(0, TOP_N);
  const picked = [], seen = new Set();
  const rand = SEED != null ? mulberry32(SEED) : Math.random;
  let guard = 0;
  while (picked.length < n && guard++ < n * 50) {
    const roll = rand();
    const pool = roll < CLICK_MIX.tokens ? tks
      : roll < CLICK_MIX.tokens + CLICK_MIX.basics ? basics : ranked;
    const j = (rand() * pool.length) | 0;
    const entry = pool[j];
    if (!entry) continue;
    const key = `${entry.name}:${j}`;
    if (seen.has(key)) continue;
    seen.add(key);
    picked.push({ name: entry.name, pool: entry.pool, id: entry.ids[(rand() * entry.ids.length) | 0] });
  }
  return picked;
}

async function sampleIndex(n) {
  const rows = await (await fetch("/carddata/cards.json")).json();
  const fronts = rows.filter((r) => r[4] === 0);
  const out = [];
  for (let i = 0; i < n; i++) {
    const r = fronts[(Math.random() * fronts.length) | 0];
    out.push({ name: r[0], id: r[3], pool: "index" });
  }
  return out;
}

const pct = (a, b) => (b ? (a / b * 100).toFixed(1) + "%" : "—");
function quantile(arr, p) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  return s[Math.min(s.length - 1, Math.floor(p * s.length))];
}
function groupAcc(list, key) {
  const out = {};
  for (const r of list) {
    const k = key(r); if (k == null) continue;
    out[k] = out[k] || { n: 0, ok: 0 };
    out[k].n++; if (r.ok) out[k].ok++;
  }
  return Object.fromEntries(Object.entries(out)
    .map(([k, v]) => [k, `${v.ok}/${v.n} (${pct(v.ok, v.n)})`]));
}

(async () => {
  try {
    say("loading card index + warming recognition worker…");
    const t0 = performance.now();
    await preload();
    if (CAP !== undefined) setIsolationCapScale(CAP);
    if (ART !== undefined) setArtScanScale(ART);
    if (OCR !== undefined) setOcrSkipDistance(OCR);
    if (HALFROT !== undefined) setHalfRotations(HALFROT);
    if (ORBN !== undefined) setOrbShortlist(ORBN);
    if (EARLYORB) setEarlyOrbProbe(true);
    if (EARLYEXIT) setEarlyOrbExit(true);
    if (EARLYSEEDS) setEarlyOrbAfterSeeds(true);
    say(`recognition ready in ${Math.round(performance.now() - t0)}ms`);

    const want = M.single ? M.size : SCENES * PER_SCENE;
    const set = M.index ? await sampleIndex(want) : await samplePopular(want);
    window.__run.total = set.length;
    say(`mode ${MODE}: drew ${set.length} cards`
        + (SEED != null ? ` (seed ${SEED})` : " (fresh draw)")
        + ` · EDHREC top ${TOP_N}`
        + (BLUR !== undefined ? ` · blurScale ${BLUR}` : " · calibrated blur")
        + (CAP !== undefined ? ` · isolation cap x${CAP}` : "")
        + (ART !== undefined ? ` · art budget x${ART}` : "")
        + (OCR !== undefined ? ` · ocr skip ${OCR}` : "")
        + (HALFROT !== undefined ? ` · halfRotations ${HALFROT}` : ""));

    const acc = [];

    // Single-card suites (Random 200, EDH staples 200) put one card alone on a
    // field with a deterministic degradation per index, rather than rendering a
    // tableau. They are the gates that cover the top-edge clipped placements,
    // which the scene modes do not exercise.
    if (M.single) {
      for (let i = 0; i < set.length; i++) {
        const card = set[i];
        const rec = { name: card.name, pool: card.pool, ok: false, ms: 0, errStage: null };
        const st = performance.now();
        try {
          const img = await loadImage(scryfallImageUrl(card.id));
          const deg = degrade(img, i);
          rec.rotationClass = deg.rotationClass;
          rec.occ = deg.occ;
          rec.placement = deg.placementClass;
          const data = await identifyCard(deg.url, { nx: 0.5, ny: 0.5 });
          rec.ms = Math.round(performance.now() - st);
          const matches = data.matches || [];
          rec.top = matches[0] && matches[0].name;
          rec.by = matches[0] && matches[0].identified_by;
          rec.dist = matches[0] && matches[0].distance;
          rec.stages = data.stage_ms || null;
          rec.wasmHeapMB = data.wasm_heap_mb;
          rec.tried = data.candidates_tried;
          rec.isolationCandidates = data.isolation_candidates;
          rec.strategy = matches[0] && matches[0].strategy;
          rec.sfTiming = data.score_full_timing;
          rec.prepTiming = data.prep_timing;
          rec.orbTiming = data.orb_timing;
          rec.earlyOrb = data.early_orb;
          const idx = matches.findIndex((m) => m.name === card.name);
          rec.trueRank = idx >= 0 ? idx + 1 : null;
          rec.ok = rec.top === card.name;
        } catch (e) {
          const msg = String((e && e.message) || e);
          rec.errStage = /timed out/i.test(msg) ? "timeout"
            : /image/i.test(msg) ? "image-load" : "identify-error";
          rec.ms = Math.round(performance.now() - st);
        }
        acc.push(rec);
        window.__run.done = acc.length;
        window.__run.correct = acc.filter((r) => r.ok).length;
        window.__run.recs = acc;
        if (acc.length % 10 === 0) {
          say(`${acc.length}/${set.length} · ${pct(window.__run.correct, acc.length)} correct`);
        }
      }
    } else
    for (let s = 0; s < SCENES; s++) {
      const group = set.slice(s * PER_SCENE, (s + 1) * PER_SCENE);
      if (!group.length) break;
      let scene = null;
      try {
        scene = await buildScene(group, s, 1920, 1080, {
          dice: !!M.dice,
          perspective: !!M.perspective,
          // Real life cycles every mat; the gate suites pin one or use cloth.
          playmat: M.playmat || (M.rotateMats ? REAL_MATS[s % REAL_MATS.length] : undefined),
          ...(BLUR !== undefined ? { blurScale: BLUR } : {}),
        });
      } catch (e) {
        for (const c of group) acc.push({ name: c.name, ok: false, ms: 0, errStage: "image-load" });
        continue;
      }
      for (const c of scene.failed) {
        acc.push({ name: c.name, ok: false, ms: 0, errStage: "image-load", pool: c.pool });
      }
      for (const p of scene.placed) {
        const rec = {
          name: p.card.name, pool: p.card.pool, scene: s,
          rotationClass: p.rotationClass, occ: p.occ, layout: p.layout,
          coverage: p.coverage, ok: false, ms: 0, errStage: null,
        };
        const st = performance.now();
        try {
          const crop = cropScene(scene.canvas, p.nx, p.ny);
          const data = await identifyCard(crop.url, { nx: crop.px, ny: crop.py });
          rec.ms = Math.round(performance.now() - st);
          const matches = data.matches || [];
          rec.top = matches[0] && matches[0].name;
          rec.by = matches[0] && matches[0].identified_by;
          rec.dist = matches[0] && matches[0].distance;
          rec.stages = data.stage_ms || null;
          rec.wasmHeapMB = data.wasm_heap_mb;
          rec.tried = data.candidates_tried;
          rec.isolationCandidates = data.isolation_candidates;
          rec.strategy = matches[0] && matches[0].strategy;
          rec.detectorUsed = data.detector_used;
          rec.detectorState = data.detector_state;
          rec.detectorDistance = data.detector_distance;
          rec.isoTiming = data.isolation_timing;
          rec.sfTiming = data.score_full_timing;
          rec.prepTiming = data.prep_timing;
          rec.orbTiming = data.orb_timing;
          rec.earlyOrb = data.early_orb;
          const idx = matches.findIndex((m) => m.name === p.card.name);
          rec.trueRank = idx >= 0 ? idx + 1 : null;
          rec.ok = rec.top === p.card.name;
          // Control: does an exact crop of the same pixels identify? Separates
          // a framing failure, which localization can reach, from a pixel one.
          if (!rec.ok) {
            try {
              const pu = perfectCrop(scene.canvas, p, scene.cardW, scene.cardH);
              const pd = await identifyCard(pu, { nx: 0.5, ny: 0.5 });
              rec.perfectOk = (pd.matches || [])[0]?.name === p.card.name;
            } catch { rec.perfectOk = null; }
          }
        } catch (e) {
          const msg = String((e && e.message) || e);
          rec.errStage = /timed out/i.test(msg) ? "timeout" : "identify-error";
          rec.ms = Math.round(performance.now() - st);
        }
        acc.push(rec);
        window.__run.done = acc.length;
        window.__run.correct = acc.filter((r) => r.ok).length;
        window.__run.recs = acc;
        if (acc.length % 5 === 0) {
          say(`${acc.length}/${window.__run.total} · ${pct(window.__run.correct, acc.length)} correct · median ${quantile(acc.filter(r=>!r.errStage).map(r=>r.ms), 0.5)}ms`);
        }
      }
      releaseScene(scene.canvas);
    }

    const okList = acc.filter((r) => !r.errStage);
    const times = okList.map((r) => r.ms);
    const half = Math.floor(acc.length / 2);
    const misses = acc.filter((r) => !r.ok && !r.errStage);
    window.__run.summary = {
      total: acc.length,
      correct: acc.filter((r) => r.ok).length,
      accuracy: pct(acc.filter((r) => r.ok).length, acc.length),
      errors: acc.filter((r) => r.errStage).length,
      medianMs: quantile(times, 0.5),
      p90Ms: quantile(times, 0.9),
      avgMs: Math.round(times.reduce((a, b) => a + b, 0) / (times.length || 1)),
      maxMs: Math.max(0, ...times),
      byPathway: groupAcc(okList, (r) => r.by || "none"),
      byRotation: groupAcc(okList, (r) => r.rotationClass),
      byOcclusion: groupAcc(okList, (r) => r.occ),
      byLayout: groupAcc(okList, (r) => r.layout),
      byPool: groupAcc(okList, (r) => r.pool),
      byPlacement: groupAcc(okList, (r) => r.placement),
      byOcc: groupAcc(okList, (r) => r.occ),
      missTrueRank: misses.reduce((m, r) => {
        const k = r.trueRank == null ? "absent" : r.trueRank <= 5 ? "rank 2-5" : "rank 6+";
        m[k] = (m[k] || 0) + 1; return m;
      }, {}),
      perfectCropRecovered: `${misses.filter((r) => r.perfectOk).length}/${misses.length}`,
      firstHalf: pct(acc.slice(0, half).filter((r) => r.ok).length, half),
      secondHalf: pct(acc.slice(half).filter((r) => r.ok).length, acc.length - half),
      wasmHeapMB: okList[okList.length - 1]?.wasmHeapMB,
      isolationFired: `${okList.filter((r) => r.isolationCandidates > 0).length}/${okList.length}`,
      detectorState: [...new Set(okList.map((r) => r.detectorState))].join(","),
      earlyOrbSplit: (() => {
        const w = okList.filter((r) => r.earlyOrb && r.earlyOrb.ran);
        const dec = w.filter((r) => r.earlyOrb.decisive);
        const right = dec.filter((r) => r.earlyOrb.name === r.name);
        return { probed: w.length, decisive: dec.length,
                 skippedIsolation: w.filter((r) => r.earlyOrb.skipped).length,
                 atSeeds: w.filter((r) => r.earlyOrb.stage === 'seeds').length,
                 atRefine: w.filter((r) => r.earlyOrb.stage === 'refine').length,
                 decisiveAndCorrect: right.length,
                 probeMs: Math.round(w.reduce((a, r) => a + r.earlyOrb.ms, 0) / (w.length || 1)) };
      })(),
      orbSplit: (() => {
        const w = okList.filter((r) => r.orbTiming && r.orbTiming.refs > 0);
        const m = (k) => Math.round(w.reduce((a, r) => a + r.orbTiming[k], 0) / (w.length || 1));
        const ranks = w.map((r) => r.orbTiming.winRank).filter((v) => v >= 0).sort((a, b) => a - b);
        return { n: w.length, fetchMs: m('fetch'), queryFeatMs: m('queryFeat'), refFeatMs: m('refFeat'), matchMs: m('match'), refs: m('refs'),
                 winRankMedian: ranks.length ? ranks[ranks.length >> 1] : null,
                 winRankP90: ranks.length ? ranks[Math.floor(ranks.length * 0.9)] : null,
                 winRankMax: ranks.length ? ranks[ranks.length - 1] : null,
                 winRankOver20: ranks.filter((v) => v >= 20).length };
      })(),
      prepSplit: (() => {
        const w = okList.filter((r) => r.prepTiming && r.prepTiming.calls > 0);
        const m = (k) => Math.round(w.reduce((a, r) => a + r.prepTiming[k], 0) / (w.length || 1));
        return { n: w.length, wbMs: m('wb'), grayMs: m('gray'), variantsMs: m('variants'), calls: m('calls') };
      })(),
      scoreFullSplit: (() => {
        const w = okList.filter((r) => r.sfTiming && r.sfTiming.calls > 0);
        const m = (k) => Math.round(w.reduce((a, r) => a + r.sfTiming[k], 0) / (w.length || 1));
        return { n: w.length, hammingMs: m('hamming'), updateMs: m('update'), artMs: m('art'), calls: m('calls') };
      })(),
      isolationSplit: (() => {
        const w = okList.filter((r) => r.isoTiming && r.isoTiming.rendered > 0);
        const m = (k) => Math.round(w.reduce((a, r) => a + r.isoTiming[k], 0) / (w.length || 1));
        return { n: w.length, scoreMs: m('score'), renderMs: m('render'), proposals: m('proposals'), rendered: m('rendered') };
      })(),
      detectorTried: `${okList.filter((r) => r.detectorUsed).length}/${okList.length}`,
      // The point of the gate: how often the prediction meant the blind sweep
      // never had to run at all.
      detectorSavedSweep: `${okList.filter((r) => r.detectorUsed && !(r.isolationCandidates > 0)).length}/${okList.filter((r) => r.detectorUsed).length}`,
      // Distance the detector's own crop achieved, split by whether the scan
      // ended up correct — this is what the skip threshold must be read from.
      detectorDistOk: okList.filter((r) => r.ok && r.detectorDistance != null).map((r) => r.detectorDistance).sort((a, b) => a - b),
      detectorDistMiss: okList.filter((r) => !r.ok && r.detectorDistance != null).map((r) => r.detectorDistance).sort((a, b) => a - b),
      triedMean: Math.round(okList.reduce((a, r) => a + (r.tried || 0), 0) / (okList.length || 1)),
      byStrategy: okList.reduce((m, r) => {
        const k = (r.strategy || "none").replace(/-\d+$/, "").replace(/^(isolate-[a-z-]+?)-.*/, "$1");
        m[k] = (m[k] || 0) + 1; return m;
      }, {}),
      stageMeans: ["prep", "hint", "rankSeeds", "rankRefine", "detector", "isolatePrep",
                   "isolateScore", "rank", "orb", "ocr"].reduce((o, k) => {
        const v = okList.map((r) => r.stages?.[k]).filter((n) => typeof n === "number");
        if (v.length) o[k] = Math.round(v.reduce((a, b) => a + b, 0) / v.length);
        return o;
      }, {}),
    };
    window.__run.finished = true;
    say("\nDONE\n" + JSON.stringify(window.__run.summary, null, 1));
    document.title = "finished";
  } catch (e) {
    window.__run.error = String(e && e.stack || e);
    say("FAILED: " + window.__run.error);
    document.title = "failed";
  }
})();
</script>
