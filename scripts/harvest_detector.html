<!doctype html>
<!--
  Training data for the card-quad detector.

  isolatePrep — a blind sweep over position, scale and angle — is 1619ms of the
  5793ms Real life median, and isolateScore another 919ms. Predicting the card's
  rectangle directly replaces the sweep. scene.js already knows where it put
  every card, so it is also the label source, and cropScene is the production
  capture geometry, so the input is what the pipeline really sees.

  Targets are cx, cy, h, cos2t, sin2t in crop-normalised coordinates. Width is
  not predicted because the aspect ratio is fixed at 63:88, and the angle is
  DOUBLED so that t and t+180 collapse to one target — the recogniser already
  hashes four rotations, so the detector only has to find the rectangle, not
  which way up it is.

  Backgrounds are split: some playmats are held out entirely, because a detector
  trained and tested on the same mats has only learned those mats. The previous
  attempt measured IoU 0.851 on trained mats against 0.777 on unseen ones, and
  that gap is the whole risk.

    PREVIEW_SAVE_DIR=/tmp/detector python3 scripts/serve_preview.py 8777
    open /scripts/harvest_detector.html?scenes=400&split=train
-->
<meta charset="utf-8">
<title>detector harvest</title>
<style>body{margin:0;background:#101014;color:#dde;font:13px ui-monospace,monospace;padding:12px}</style>
<div id="log">…</div>

<script type="module">
import { buildScene, cropScene, releaseScene } from "/src/snaptest/scene.js";

const q = new URLSearchParams(location.search);
const SCENES = +(q.get("scenes") ?? 400);
const SPLIT = q.get("split") ?? "train";
const SIZE = +(q.get("size") ?? 128);
const SEED_BASE = +(q.get("seed") ?? 0);

// Held-out mats never appear in training, so held-out IoU measures
// generalization to unseen artwork rather than memorisation.
const TRAIN_MATS = ["magic-con-vegas", "mythic-land-black", "mythic-land-other",
  "ultra-pro-green", "ultra-pro-blue", "ultra-pro-red", "ultra-pro-white", null];
const HELDOUT_MATS = ["ff-cloud", "commander-series-2"];
const MATS = SPLIT === "heldout" ? HELDOUT_MATS : TRAIN_MATS;

const logEl = document.getElementById("log");
const say = (s) => { logEl.textContent = s; };

const save = (name, blob) => fetch("/__save/" + name, { method: "POST", body: blob }).then(r => r.text());
const toBlob = (canvas, q = 0.85) =>
  new Promise((res) => canvas.toBlob(res, "image/jpeg", q));

// Fresh cards each scene keeps the detector from keying on specific artwork.
async function cardPool() {
  const rows = await (await fetch("/carddata/cards.json")).json();
  return rows.filter((r) => r[4] === 0).map((r) => ({ id: r[3], name: r[0] }));
}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

(async () => {
  const fronts = await cardPool();
  const rnd = mulberry32(0x5eed ^ (SEED_BASE * 2654435761));
  const out = document.createElement("canvas");
  out.width = out.height = SIZE;
  const ox = out.getContext("2d");
  const labels = [];
  let i = 0;

  for (let s = 0; s < SCENES; s++) {
    const sceneIdx = SEED_BASE + s;
    const group = Array.from({ length: 10 },
      () => fronts[(rnd() * fronts.length) | 0]);
    let scene;
    try {
      scene = await buildScene(group, sceneIdx, 1920, 1080, {
        dice: true, perspective: true, playmat: MATS[sceneIdx % MATS.length],
      });
    } catch { continue; }
    if (!scene.canvas) continue;

    for (const p of scene.placed) {
      const crop = cropScene(scene.canvas, p.nx, p.ny);
      // Draw the crop down to the detector's input size.
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = crop.url; });
      ox.drawImage(img, 0, 0, SIZE, SIZE);
      const fn = `${SPLIT}_${String(i).padStart(6, "0")}.jpg`;
      await save(fn, await toBlob(out));

      // Label in crop-normalised space. p.angle is degrees clockwise.
      const t = p.angle * Math.PI / 180;
      labels.push({
        f: fn,
        cx: +((p.cx - crop.sx) / crop.side).toFixed(5),
        cy: +((p.cy - crop.sy) / crop.side).toFixed(5),
        h:  +((p.h ?? scene.cardH) / crop.side).toFixed(5),
        c2: +Math.cos(2 * t).toFixed(5),
        s2: +Math.sin(2 * t).toFixed(5),
        mat: MATS[sceneIdx % MATS.length] || "cloth",
        rot: p.rotationClass, occ: p.occ,
      });
      i++;
    }
    releaseScene(scene.canvas);
    if (s % 10 === 0) say(`${SPLIT}: scene ${s}/${SCENES}, ${i} samples`);
  }

  await save(`labels_${SPLIT}.json`,
    new Blob([JSON.stringify(labels)], { type: "application/json" }));
  say(`DONE — ${labels.length} ${SPLIT} samples`);
  document.title = "finished";
})().catch((e) => { say("FAILED: " + (e && e.stack || e)); document.title = "failed"; });
</script>
