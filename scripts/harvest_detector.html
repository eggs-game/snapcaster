<!doctype html>
<!--
  Training data for the card-quad detector.

  isolatePrep — a blind sweep over position, scale and angle — is the largest
  single cost in the pipeline, and at calibrated blur the perfect-crop control
  says correct framing would also recover 42% of misses. So predicting the
  card's rectangle directly is both the speed lever and the accuracy lever.

  scene.js already knows where it put every card, so it is also the label
  source, and cropScene is the production capture geometry, so the input is what
  the pipeline really sees.

  Targets are cx, cy, h, cos2t, sin2t in crop-normalised coordinates. Width is
  not predicted because the aspect ratio is fixed at 63:88, and the angle is
  DOUBLED so t and t+180 collapse to one target — the recogniser already hashes
  four rotations, so the detector only has to find the rectangle, not which way
  up it is.

  Two playmats are held out entirely. A detector trained and tested on the same
  mats has only learned those mats, and the previous attempt measured IoU 0.851
  on trained mats against 0.777 on unseen ones — that gap is the whole risk.

  Output files are scoped by `seed`, so runs ACCUMULATE rather than overwrite:
  generate the corpus as several short chunks instead of one long unattended
  run, which a throttled pane cannot sustain.

    PREVIEW_SAVE_DIR=/tmp/detector python3 scripts/serve_preview.py 8777
    open /scripts/harvest_detector.html?scenes=300&split=train&seed=0
    open /scripts/harvest_detector.html?scenes=300&split=train&seed=300
-->
<meta charset="utf-8">
<title>detector harvest</title>
<style>body{margin:0;background:#101014;color:#dde;font:13px ui-monospace,monospace;padding:12px}</style>
<div id="log">…</div>

<script type="module">
import { buildScene, releaseScene } from "/src/snaptest/scene.js";
import { cropGeometry } from "/src/captureGeometry.js";

const q = new URLSearchParams(location.search);
const SCENES = +(q.get("scenes") ?? 1200);
const SPLIT = q.get("split") ?? "train";
const SIZE = +(q.get("size") ?? 128);
const SEED_BASE = +(q.get("seed") ?? 0);
// Procedural backgrounds: unlimited variety, so no mat can be memorised.
// Training only — the benchmark keeps the real supplied playmats.
const PROCEDURAL = q.get("procedural") !== "0";
const POOL = +(q.get("pool") ?? 400);      // distinct printings, so images cache
const BATCH = 250;                          // images per POST

const TRAIN_MATS = ["magic-con-vegas", "mythic-land-black", "mythic-land-other",
  "ultra-pro-green", "ultra-pro-blue", "ultra-pro-red", "ultra-pro-white", null];
const HELDOUT_MATS = ["ff-cloud", "commander-series-2"];
const MATS = SPLIT === "heldout" ? HELDOUT_MATS : TRAIN_MATS;

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

const logEl = document.getElementById("log");
const say = (s) => { logEl.textContent = s; };

// One POST per image would be ~12,000 round trips. Batches are length-prefixed:
// [uint32 count][uint32 len]*count then the JPEG bytes back to back.
async function postBatch(name, blobs) {
  const bufs = await Promise.all(blobs.map((b) => b.arrayBuffer()));
  const header = new ArrayBuffer(4 + 4 * bufs.length);
  const dv = new DataView(header);
  dv.setUint32(0, bufs.length, true);
  bufs.forEach((b, i) => dv.setUint32(4 + 4 * i, b.byteLength, true));
  await fetch("/__save/" + name, { method: "POST", body: new Blob([header, ...bufs]) });
}

(async () => {
  const rows = await (await fetch("/carddata/cards.json")).json();
  const fronts = rows.filter((r) => r[4] === 0);
  const rnd = mulberry32(0x5eed ^ ((SEED_BASE + 1) * 2654435761));
  // A bounded pool so the browser caches the reference images instead of
  // fetching 12,000 of them; still far more artwork than the detector could
  // memorise, and the card is not what it is being asked to find.
  const pool = Array.from({ length: POOL }, () => {
    const r = fronts[(rnd() * fronts.length) | 0];
    return { id: r[3], name: r[0] };
  });

  // Batch and label files are scoped by SEED_BASE. Every run used to write
  // train_0000.bin and labels_train.json, so a second run silently overwrote
  // the first — which made the corpus un-resumable exactly when it needed to
  // be. A hidden pane slows generation ~4x (see snaptest/results.md), and the
  // answer to that is not one long unattended run this environment cannot
  // hold open, it is many short chunks that accumulate.
  const CHUNK = `${SPLIT}_s${SEED_BASE}`;

  const out = document.createElement("canvas");
  out.width = out.height = SIZE;
  const ox = out.getContext("2d");
  const labels = [];
  let pending = [], batchIdx = 0, i = 0;
  const t0 = performance.now();
  let lastCount = 0, lastAt = t0;

  for (let s = 0; s < SCENES; s++) {
    const sceneIdx = SEED_BASE + s;
    const group = Array.from({ length: 10 }, () => pool[(rnd() * pool.length) | 0]);
    let scene;
    try {
      scene = await buildScene(group, sceneIdx, 1920, 1080, {
        dice: true, perspective: true,
        // Held-out evaluation still uses the REAL unseen mats: the question is
        // whether procedural training generalises to actual playmats.
        ...(PROCEDURAL && SPLIT === "train"
          ? { proceduralBg: true }
          : { playmat: MATS[sceneIdx % MATS.length] }),
      });
    } catch { continue; }
    if (!scene.canvas) continue;

    for (const p of scene.placed) {
      // cropGeometry is the same function cropScene uses, so the framing is
      // production's — but it returns the numbers without encoding anything.
      //
      // cropScene itself allocates a canvas and JPEG-encodes a data URL. The
      // harvester only ever needed sx/sy/side, and decoding that URL back into
      // an Image measured 10,155ms per ten samples, ~80% of generation time,
      // because procedural backgrounds compress far worse than a smooth playmat
      // photo. Calling cropScene purely for its geometry still paid the encode
      // and left the discarded strings for the collector, which is why the rate
      // kept decaying over a run rather than being merely slow.
      const crop = cropGeometry(scene.canvas.width, scene.canvas.height, p.nx, p.ny);
      ox.drawImage(scene.canvas, crop.sx, crop.sy, crop.side, crop.side,
                   0, 0, SIZE, SIZE);
      const blob = await new Promise((r) => out.toBlob(r, "image/jpeg", 0.85));
      pending.push(blob);

      const t = p.angle * Math.PI / 180;
      labels.push({
        i,
        cx: +((p.cx - crop.sx) / crop.side).toFixed(5),
        cy: +((p.cy - crop.sy) / crop.side).toFixed(5),
        h:  +((p.h ?? scene.cardH) / crop.side).toFixed(5),
        c2: +Math.cos(2 * t).toFixed(5),
        s2: +Math.sin(2 * t).toFixed(5),
        mat: (PROCEDURAL && SPLIT === "train") ? "procedural" : (MATS[sceneIdx % MATS.length] || "cloth"),
        rot: p.rotationClass, occ: p.occ,
      });
      i++;

      if (pending.length >= BATCH) {
        await postBatch(`${CHUNK}_${String(batchIdx++).padStart(4, "0")}.bin`, pending);
        pending = [];
        // Flush labels with every batch, not once at the end. A run that is
        // interrupted — and under throttling they will be — otherwise leaves
        // images on disk with no labels at all, which is worse than useless.
        // Only labels for images already POSTed are written, so the two files
        // always agree.
        await fetch("/__save/labels_" + CHUNK + ".json",
          { method: "POST", body: new Blob([JSON.stringify(labels.slice(0, batchIdx * BATCH))]) });
      }
    }
    releaseScene(scene.canvas);
    if (s % 20 === 0) {
      // Instantaneous rate, and whether the tab is hidden. A hidden pane is
      // throttled to a full stop, and a CUMULATIVE rate hides that completely —
      // it just decays, which reads as a memory leak or a slow generator. Two
      // real but irrelevant optimisations were made chasing that before
      // `document.hidden` was checked.
      const now = performance.now();
      const rate = (i - lastCount) / Math.max(0.001, (now - lastAt) / 1000);
      lastCount = i; lastAt = now;
      say(`${SPLIT}: scene ${s}/${SCENES} · ${i} samples · ${rate.toFixed(1)}/s now`
          + (document.hidden ? " · TAB HIDDEN (throttled)" : ""));
    }
  }
  if (pending.length) await postBatch(`${CHUNK}_${String(batchIdx++).padStart(4, "0")}.bin`, pending);

  await fetch("/__save/labels_" + CHUNK + ".json",
    { method: "POST", body: new Blob([JSON.stringify(labels)]) });
  say(`DONE — ${labels.length} ${SPLIT} samples in ${batchIdx} batches`);
  document.title = "finished";
})().catch((e) => { say("FAILED: " + (e && e.stack || e)); document.title = "failed"; });
</script>
