name: Build card index

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_index.py"
      - "scripts/build_milo_catalog.py"
      - ".github/workflows/build-index.yml"
  workflow_dispatch:
  schedule:
    - cron: "37 23 * * *" # daily, after Scryfall's usual bulk snapshot

concurrency:
  group: card-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install numpy opencv-python-headless pillow requests onnxruntime==1.31.0
      - uses: actions/cache@v4
        with:
          path: |
            .cache/milo
            .cache/ai-lookup/model.onnx
            .cache/ai-lookup/milo1-scryfall-mtg-2026-07-09.npz
          key: milo1-v1-${{ hashFiles('public/carddata/cards.json') }}
          restore-keys: milo1-v1-
      - name: Verify updater and hash contract
        run: |
          python scripts/test_bulk_index.py
          python scripts/test_index_metadata.py
          python scripts/test_hash_compat.py
          python scripts/check_hash_duplication.py
      - name: Build index
        run: python scripts/build_index.py --bulk default_cards --workers 8
      - name: Verify complete output tables
        run: python scripts/verify_card_index.py
      - name: Update local Milo embeddings for every card face
        run: python scripts/build_milo_catalog.py --workers 4
      - name: Verify complete Milo catalog and source alignment
        run: python scripts/verify_milo_catalog.py
      - name: Commit index
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f public/carddata
          git add public/vendor/vision/milo1
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update card index"
          git pull --rebase origin main
          git push
