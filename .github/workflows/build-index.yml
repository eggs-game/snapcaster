name: Build card index

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_index.py"
      - ".github/workflows/build-index.yml"
  workflow_dispatch:
  schedule:
    - cron: "37 23 * * *" # daily, after Scryfall's usual bulk snapshot

concurrency:
  group: card-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install numpy opencv-python-headless pillow requests
      - name: Verify updater and hash contract
        run: |
          python scripts/test_bulk_index.py
          python scripts/test_index_metadata.py
          python scripts/test_hash_compat.py
          python scripts/check_hash_duplication.py
      - name: Build index
        run: python scripts/build_index.py --bulk default_cards --workers 8
      - name: Verify complete output tables
        run: python scripts/verify_card_index.py
      - name: Commit index
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f public/carddata
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update card index"
          git pull --rebase origin main
          git push
